name: DevSecOps Pipeline
on: [push, pull_request]

jobs:

  # 1️⃣ BUILD
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t vuln-app:${{ github.sha }} .
      - name: Save Docker image
        run: docker save vuln-app:${{ github.sha }} > image.tar
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  # 2️⃣ SAST - Analyse statique du code
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >
            p/security-audit
            p/secrets
            p/owasp-top-ten

  # 3️⃣ SCA - Analyse des dépendances
  sca:
    name: SCA - npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: ./src
        run: npm install
      - name: Run npm audit
        working-directory: ./src
        run: |
          npm audit --json > audit.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: src/audit.json

  # 4️⃣ Secret Detection - Gitleaks
  secrets:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 5️⃣ Container Scan - Trivy
  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load Docker image
        run: docker load < image.tar
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vuln-app:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL

  # 6️⃣ Report
  report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [sast, sca, secrets, container-scan]
    if: always()
    steps:
      - name: Generate JSON Report
        run: |
          cat > security-report.json <<EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "results": {
              "sast": {"status": "${{ needs.sast.result }}", "tool": "Semgrep"},
              "sca": {"status": "${{ needs.sca.result }}", "tool": "npm audit"},
              "secrets": {"status": "${{ needs.secrets.result }}", "tool": "Gitleaks"},
              "container_scan": {"status": "${{ needs.container-scan.result }}", "tool": "Trivy"}
            }
          }
          EOF
          cat security-report.json | jq '.'
      - uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.json
