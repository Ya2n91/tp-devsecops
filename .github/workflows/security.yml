name: DevSecOps Pipeline
on: [push, pull_request]

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t vuln-app:${{ github.sha }} .
      - name: Save image
        run: docker save vuln-app:${{ github.sha }} > image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit,p/secrets,p/owasp-top-ten

  sca:
    name: SCA (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
        working-directory: ./src
      - run: |
          npm audit --json > npm-audit.json
          npm audit
        working-directory: ./src
      - uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: src/npm-audit.json

  secrets:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

 container-scan:
  name: Container Scan
  runs-on: ubuntu-latest
  needs: build
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: docker-image
    - name: Load image
      run: docker load < image.tar
    - name: Trivy scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: vuln-app:${{ github.sha }}
        format: 'table'
        exit-code: '1'
        severity: 'CRITICAL,HIGH'


  report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [sast, sca, secrets, container-scan]
    if: always()
    steps:
      - run: |
          cat > security-report.json <<EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "results": {
              "sast": {"status": "${{ needs.sast.result }}"},
              "sca": {"status": "${{ needs.sca.result }}"},
              "secrets": {"status": "${{ needs.secrets.result }}"},
              "container_scan": {"status": "${{ needs.container-scan.result }}"}
            }
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.json
